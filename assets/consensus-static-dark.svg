<svg xmlns="http://www.w3.org/2000/svg" width="400" height="156" viewBox="0 0 400 156" role="img" aria-labelledby="title desc">
  <title id="title">Raft leader failover</title><desc id="desc">In this four-server illustration, A goes offline. After an election timeout, B requests votes from C and D. With its own vote and both replies, B becomes leader with a three-of-four majority. A stays offline. Schematic illustration.</desc>
  <style>.packet { opacity:0; }</style>
  <rect width="400" height="156" rx="8" fill="#11191c"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13"><g font-size="10" letter-spacing="1"><text x="200" y="16" text-anchor="middle" fill="#aebfc4">FOUR SERVERS · MAJORITY = 3</text></g>
        <path d="M92 74 H144" stroke="#35454a" stroke-width="1.5" stroke-dasharray="3 4"/>
        <g fill="none" stroke="#35454a" stroke-width="1.5">
          <path d="M234 65 L300 39 M300 49 L234 75"/>
          <path d="M234 81 L300 101 M300 111 L234 91"/>
        </g>
        <g class="old-server" opacity=".45">
          <rect x="16" y="54" width="76" height="42" rx="7" fill="#11191c" stroke="#35454a"/>
          <text x="54" y="71" text-anchor="middle" fill="#aebfc4" font-size="14" font-weight="600">A</text>
          <g class="initial-role" opacity="0"><text x="54" y="88" text-anchor="middle" fill="#aebfc4">leader</text></g>
          <g class="offline-role"><text x="54" y="88" text-anchor="middle" fill="#aebfc4">offline</text></g>
        </g>
        <rect x="144" y="54" width="90" height="42" rx="7" fill="#11191c" stroke="#35454a"/>
        <rect class="new-leader" x="144" y="54" width="90" height="42" rx="7" fill="#233e39" stroke="#60cbb5" stroke-width="1.5"/>
        <text x="189" y="71" text-anchor="middle" fill="#60cbb5" font-size="14" font-weight="600">B</text>
        <g class="follower-role" opacity="0"><text x="189" y="88" text-anchor="middle" fill="#aebfc4">follower</text></g>
        <g class="candidate-role" opacity="0"><text x="189" y="88" text-anchor="middle" fill="#aebfc4">candidate</text></g>
        <g class="leader-role"><text x="189" y="88" text-anchor="middle" fill="#aebfc4">leader</text></g>
        <rect x="300" y="25" width="84" height="42" rx="7" fill="#11191c" stroke="#35454a"/>
        <text x="342" y="42" text-anchor="middle" fill="#aebfc4" font-size="14" font-weight="600">C</text>
        <text x="342" y="59" text-anchor="middle" fill="#aebfc4">follower</text>
        <rect x="300" y="87" width="84" height="42" rx="7" fill="#11191c" stroke="#35454a"/>
        <text x="342" y="104" text-anchor="middle" fill="#aebfc4" font-size="14" font-weight="600">D</text>
        <text x="342" y="121" text-anchor="middle" fill="#aebfc4">follower</text>
        <g class="stage-start" opacity="0"><text x="200" y="146" text-anchor="middle" fill="#aebfc4">A leads the cluster</text></g>
        <g class="stage-timeout" opacity="0"><text x="200" y="146" text-anchor="middle" fill="#aebfc4">A goes offline · election timeout</text></g>
        <g class="stage-vote" opacity="0"><text x="200" y="146" text-anchor="middle" fill="#aebfc4">B votes for itself and asks C + D</text></g>
        <g class="stage-done"><text x="200" y="146" text-anchor="middle" fill="#aebfc4">B + C + D · 3 of 4 votes · B elected</text></g>
        <circle class="packet vote-request" cx="234" cy="65" r="3" fill="#60cbb5" style="--dx:66px;--dy:-26px"/>
        <circle class="packet vote-request" cx="234" cy="81" r="3" fill="#60cbb5" style="--dx:66px;--dy:20px"/>
        <circle class="packet vote-reply" cx="300" cy="49" r="3" fill="#60cbb5" style="--dx:-66px;--dy:26px"/>
        <circle class="packet vote-reply" cx="300" cy="111" r="3" fill="#60cbb5" style="--dx:-66px;--dy:-20px;animation-delay:.12s"/>
        </g>
</svg>
