<svg xmlns="http://www.w3.org/2000/svg" width="400" height="112" viewBox="0 0 400 112" role="img" aria-labelledby="title desc">
  <title id="title">A request through the Redis-style server</title><desc id="desc">GET city travels from a client through the event loop to an in-memory table. The matching value, Austin, returns to the client. Schematic illustration.</desc>
  <style>
    .packet { opacity:0; animation:travel 1.8s ease-in-out 2; }
    @keyframes travel {
      0%,12% { opacity:0; transform:translate(0,0); }
      22% { opacity:1; }
      72% { opacity:1; transform:translate(var(--dx),var(--dy)); }
      84%,100% { opacity:0; transform:translate(var(--dx),var(--dy)); }
    }
    @media(prefers-reduced-motion:reduce) { .packet { animation:none; } }

        .request { animation:request 4.6s ease-in-out 1; }
        .response { animation:response 4.6s ease-in-out 1; }
        .io-ring { animation:poll 4.6s ease-in-out 1; }
        .lookup-row { animation:lookup 4.6s ease-in-out 1; }
        @keyframes request {
          0%,5% { opacity:0; transform:translateX(0); }
          10% { opacity:1; transform:translateX(0); }
          26% { opacity:1; transform:translateX(90px); }
          43% { opacity:1; transform:translateX(175px); }
          46%,100% { opacity:0; transform:translateX(175px); }
        }
        @keyframes response {
          0%,54% { opacity:0; transform:translate(0,0); }
          58% { opacity:1; transform:translate(0,0); }
          87% { opacity:1; transform:translate(-272px,0); }
          94% { opacity:1; transform:translate(-272px,-18px); }
          97%,100% { opacity:0; transform:translate(-272px,-18px); }
        }
        @keyframes poll {
          0%,15% { transform:rotate(0); }
          46%,100% { transform:rotate(360deg); }
        }
        @keyframes lookup {
          0%,40%,70%,100% { opacity:.12; }
          48%,58% { opacity:.4; }
        }
        @media(prefers-reduced-motion:reduce) {
          .request,.response,.io-ring,.lookup-row { animation:none; }
        }
        </style>
  <rect width="400" height="112" rx="8" fill="#f6faf9"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13"><g font-size="10" letter-spacing="1">
          <text x="60" y="18" text-anchor="middle" fill="#526f68">CLIENT</text><text x="194" y="18" text-anchor="middle" fill="#526f68">EVENT LOOP</text><text x="332" y="18" text-anchor="middle" fill="#526f68">IN MEMORY</text>
        </g>
        <path d="M104 50 H279 M332 79 V91 H60 V73" fill="none" stroke="#cdded7" stroke-width="1.5"/>
        <path d="M272 47 L279 50 L272 53 M57 80 L60 73 L63 80" fill="none" stroke="#167b66" stroke-width="1.5"/>
        <rect x="16" y="31" width="88" height="42" rx="7" fill="#f6faf9" stroke="#cdded7"/>
        <text x="60" y="55" text-anchor="middle" fill="#167b66" font-family="ui-monospace,Menlo,monospace" font-size="12">GET city</text>
        <circle cx="194" cy="50" r="17" fill="#f6faf9" stroke="#cdded7" stroke-width="2"/>
        <g class="io-ring" style="transform-origin:194px 50px">
          <path d="M194 33 A17 17 0 0 1 211 50" fill="none" stroke="#167b66" stroke-width="2" stroke-linecap="round"/>
        </g>
        <text x="194" y="54" text-anchor="middle" fill="#526f68" font-size="10">I/O</text>
        <rect x="279" y="31" width="106" height="48" rx="6" fill="#f6faf9" stroke="#cdded7"/>
        <rect class="lookup-row" x="282" y="34" width="100" height="21" rx="3" fill="#167b66" opacity=".12"/>
        <g font-family="ui-monospace,Menlo,monospace" font-size="11">
          <text x="290" y="48" fill="#526f68">city</text><text x="329" y="48" fill="#167b66">Austin</text>
          <text x="290" y="70" fill="#526f68">id</text><text x="329" y="70" fill="#526f68">42</text>
        </g>
        <text x="194" y="106" text-anchor="middle" fill="#167b66" font-family="ui-monospace,Menlo,monospace" font-size="12">"Austin"</text>
        <circle class="packet request" cx="104" cy="50" r="3" fill="#167b66"/>
        <circle class="packet response" cx="332" cy="91" r="3" fill="#167b66"/>
        </g>
</svg>
