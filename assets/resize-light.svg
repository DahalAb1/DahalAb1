<svg xmlns="http://www.w3.org/2000/svg" width="400" height="76" viewBox="0 0 400 76" role="img" aria-labelledby="title desc">
  <title id="title">Incremental hash-table resizing</title><desc id="desc">Entries move from the old table to a larger table a little at a time. Schematic illustration.</desc>
  <style>
    .packet { opacity:0; animation:travel 1.8s ease-in-out 2; }
    @keyframes travel {
      0%,12% { opacity:0; transform:translate(0,0); }
      22% { opacity:1; }
      72% { opacity:1; transform:translate(var(--dx),var(--dy)); }
      84%,100% { opacity:0; transform:translate(var(--dx),var(--dy)); }
    }
    @media(prefers-reduced-motion:reduce) { .packet { animation:none; } }
    </style>
  <rect width="400" height="76" rx="8" fill="#f6faf9"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13"><path d="M107 31 L215 31" stroke="#cdded7" stroke-width="1.5"/><rect x="25" y="23" width="15" height="16" rx="3" fill="#deeee7" stroke="#cdded7"/><rect x="45" y="23" width="15" height="16" rx="3" fill="#deeee7" stroke="#cdded7"/><rect x="65" y="23" width="15" height="16" rx="3" fill="#deeee7" stroke="#cdded7"/><rect x="85" y="23" width="15" height="16" rx="3" fill="#deeee7" stroke="#cdded7"/><rect x="215" y="23" width="15" height="16" rx="3" fill="#deeee7" stroke="#cdded7"/><rect x="235" y="23" width="15" height="16" rx="3" fill="#deeee7" stroke="#cdded7"/><rect x="255" y="23" width="15" height="16" rx="3" fill="#deeee7" stroke="#cdded7"/><rect x="275" y="23" width="15" height="16" rx="3" fill="#deeee7" stroke="#cdded7"/><rect x="295" y="23" width="15" height="16" rx="3" fill="#deeee7" stroke="#cdded7"/><rect x="315" y="23" width="15" height="16" rx="3" fill="#deeee7" stroke="#cdded7"/><rect x="335" y="23" width="15" height="16" rx="3" fill="#deeee7" stroke="#cdded7"/><rect x="355" y="23" width="15" height="16" rx="3" fill="#deeee7" stroke="#cdded7"/><circle class="packet" cx="92" cy="31" r="3" fill="#167b66" style="--dx:150px;--dy:0px;animation-delay:0s"/><text x="62" y="65" text-anchor="middle" fill="#526f68">old table</text><text x="292" y="65" text-anchor="middle" fill="#526f68">grow a little at a time</text></g>
</svg>
