<svg xmlns="http://www.w3.org/2000/svg" width="400" height="112" viewBox="0 0 400 112" role="img" aria-labelledby="title desc">
  <title id="title">A request through the Redis-style server</title><desc id="desc">GET city travels from a client through the event loop to an in-memory table. The matching value, Austin, returns to the client. Schematic illustration.</desc>
  <style>.packet { opacity:0; }
        .request { animation:request-intro 4.6s ease-in-out 0s 1, request-sequence 16.9s ease-in-out 5.8s infinite; }
        .response { animation:response-intro 4.6s ease-in-out 0s 1, response-sequence 16.9s ease-in-out 5.8s infinite; }
        .io-ring { animation:poll-intro 4.6s ease-in-out 0s 1, poll-sequence 16.9s ease-in-out 5.8s infinite; }
        .lookup-row { animation:lookup-intro 4.6s ease-in-out 0s 1, lookup-sequence 16.9s ease-in-out 5.8s infinite; }




        @media(prefers-reduced-motion:reduce) {
          .request,.response,.io-ring,.lookup-row { animation:none; }
        }
        @keyframes request-intro{0.00000000%{opacity:0; transform:translateX(0);}5.00000000%{opacity:0; transform:translateX(0);}10.00000000%{opacity:1; transform:translateX(0);}26.00000000%{opacity:1; transform:translateX(90px);}43.00000000%{opacity:1; transform:translateX(175px);}46.00000000%{opacity:0; transform:translateX(175px);}100.00000000%{opacity:0; transform:translateX(175px);}}@keyframes request-sequence{0.00000000%{opacity:0; transform:translateX(175px);}28.40230769%{opacity:0; transform:translateX(175px);}28.40236686%{opacity:0; transform:translateX(0);}29.76331361%{opacity:0; transform:translateX(0);}31.12426036%{opacity:1; transform:translateX(0);}35.47928994%{opacity:1; transform:translateX(90px);}40.10650888%{opacity:1; transform:translateX(175px);}40.92307692%{opacity:0; transform:translateX(175px);}55.62130178%{opacity:0; transform:translateX(175px);}100.00000000%{opacity:0; transform:translateX(175px);}}@keyframes response-intro{0.00000000%{opacity:0; transform:translate(0,0);}54.00000000%{opacity:0; transform:translate(0,0);}58.00000000%{opacity:1; transform:translate(0,0);}87.00000000%{opacity:1; transform:translate(-272px,0);}94.00000000%{opacity:1; transform:translate(-272px,-18px);}97.00000000%{opacity:0; transform:translate(-272px,-18px);}100.00000000%{opacity:0; transform:translate(-272px,-18px);}}@keyframes response-sequence{0.00000000%{opacity:0; transform:translate(-272px,-18px);}28.40230769%{opacity:0; transform:translate(-272px,-18px);}28.40236686%{opacity:0; transform:translate(0,0);}43.10059172%{opacity:0; transform:translate(0,0);}44.18934911%{opacity:1; transform:translate(0,0);}52.08284024%{opacity:1; transform:translate(-272px,0);}53.98816568%{opacity:1; transform:translate(-272px,-18px);}54.80473373%{opacity:0; transform:translate(-272px,-18px);}55.62130178%{opacity:0; transform:translate(-272px,-18px);}100.00000000%{opacity:0; transform:translate(-272px,-18px);}}@keyframes poll-intro{0.00000000%{transform:rotate(0);}15.00000000%{transform:rotate(0);}46.00000000%{transform:rotate(360deg);}100.00000000%{transform:rotate(360deg);}}@keyframes poll-sequence{0.00000000%{transform:rotate(360deg);}28.40230769%{transform:rotate(360deg);}28.40236686%{transform:rotate(0);}32.48520710%{transform:rotate(0);}40.92307692%{transform:rotate(360deg);}55.62130178%{transform:rotate(360deg);}100.00000000%{transform:rotate(360deg);}}@keyframes lookup-intro{0.00000000%{opacity:.12;}40.00000000%{opacity:.12;}48.00000000%{opacity:.4;}58.00000000%{opacity:.4;}70.00000000%{opacity:.12;}100.00000000%{opacity:.12;}}@keyframes lookup-sequence{0.00000000%{opacity:.12;}28.40230769%{opacity:.12;}28.40236686%{opacity:.12;}39.28994083%{opacity:.12;}41.46745562%{opacity:.4;}44.18934911%{opacity:.4;}47.45562130%{opacity:.12;}55.62130178%{opacity:.12;}100.00000000%{opacity:.12;}}</style>
  <rect width="400" height="112" rx="8" fill="#f6faf9"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13"><g font-size="10" letter-spacing="1">
          <text x="60" y="18" text-anchor="middle" fill="#526f68">CLIENT</text><text x="194" y="18" text-anchor="middle" fill="#526f68">EVENT LOOP</text><text x="332" y="18" text-anchor="middle" fill="#526f68">IN MEMORY</text>
        </g>
        <path d="M104 50 H279 M332 79 V91 H60 V73" fill="none" stroke="#cdded7" stroke-width="1.5"/>
        <path d="M272 47 L279 50 L272 53 M57 80 L60 73 L63 80" fill="none" stroke="#167b66" stroke-width="1.5"/>
        <rect x="16" y="31" width="88" height="42" rx="7" fill="#f6faf9" stroke="#cdded7"/>
        <text x="60" y="55" text-anchor="middle" fill="#167b66" font-family="ui-monospace,Menlo,monospace" font-size="12">GET city</text>
        <circle cx="194" cy="50" r="17" fill="#f6faf9" stroke="#cdded7" stroke-width="2"/>
        <g class="io-ring" style="transform-origin:194px 50px">
          <path d="M194 33 A17 17 0 0 1 211 50" fill="none" stroke="#167b66" stroke-width="2" stroke-linecap="round"/>
        </g>
        <text x="194" y="54" text-anchor="middle" fill="#526f68" font-size="10">I/O</text>
        <rect x="279" y="31" width="106" height="48" rx="6" fill="#f6faf9" stroke="#cdded7"/>
        <rect class="lookup-row" x="282" y="34" width="100" height="21" rx="3" fill="#167b66" opacity=".12"/>
        <g font-family="ui-monospace,Menlo,monospace" font-size="11">
          <text x="290" y="48" fill="#526f68">city</text><text x="329" y="48" fill="#167b66">Austin</text>
          <text x="290" y="70" fill="#526f68">id</text><text x="329" y="70" fill="#526f68">42</text>
        </g>
        <text x="194" y="106" text-anchor="middle" fill="#167b66" font-family="ui-monospace,Menlo,monospace" font-size="12">"Austin"</text>
        <circle class="packet request" cx="104" cy="50" r="3" fill="#167b66"/>
        <circle class="packet response" cx="332" cy="91" r="3" fill="#167b66"/>
        </g>
</svg>
