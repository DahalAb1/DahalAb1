<svg xmlns="http://www.w3.org/2000/svg" width="400" height="76" viewBox="0 0 400 76" role="img" aria-labelledby="title desc">
  <title id="title">Neural-network forward pass</title><desc id="desc">Two inputs pass through two hidden neurons to one output. Schematic illustration.</desc>
  <style>
    .packet { opacity:0; animation:travel 1.8s ease-in-out 2; }
    @keyframes travel {
      0%,12% { opacity:0; transform:translate(0,0); }
      22% { opacity:1; }
      72% { opacity:1; transform:translate(var(--dx),var(--dy)); }
      84%,100% { opacity:0; transform:translate(var(--dx),var(--dy)); }
    }
    @media(prefers-reduced-motion:reduce) { .packet { animation:none; } }
    </style>
  <rect width="400" height="76" rx="8" fill="#11191c"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13"><path d="M60 18 L200 18" stroke="#35454a" stroke-width="1.5"/><path d="M60 18 L200 42" stroke="#35454a" stroke-width="1.5"/><path d="M200 18 L340 30" stroke="#35454a" stroke-width="1.5"/><path d="M60 42 L200 18" stroke="#35454a" stroke-width="1.5"/><path d="M60 42 L200 42" stroke="#35454a" stroke-width="1.5"/><path d="M200 42 L340 30" stroke="#35454a" stroke-width="1.5"/><circle class="packet" cx="60" cy="18" r="3" fill="#60cbb5" style="--dx:140px;--dy:0px;animation-delay:0s"/><circle class="packet" cx="60" cy="42" r="3" fill="#60cbb5" style="--dx:140px;--dy:0px;animation-delay:0s"/><circle class="packet" cx="200" cy="18" r="3" fill="#60cbb5" style="--dx:140px;--dy:12px;animation-delay:0.9s"/><circle class="packet" cx="200" cy="42" r="3" fill="#60cbb5" style="--dx:140px;--dy:-12px;animation-delay:0.9s"/><circle cx="60" cy="18" r="6" fill="#233e39" stroke="#60cbb5" stroke-width="1.5"/><circle cx="60" cy="42" r="6" fill="#233e39" stroke="#60cbb5" stroke-width="1.5"/><circle cx="200" cy="18" r="6" fill="#233e39" stroke="#60cbb5" stroke-width="1.5"/><circle cx="200" cy="42" r="6" fill="#233e39" stroke="#60cbb5" stroke-width="1.5"/><circle cx="340" cy="30" r="6" fill="#233e39" stroke="#60cbb5" stroke-width="1.5"/><text x="60" y="66" text-anchor="middle" fill="#aebfc4">inputs</text><text x="200" y="66" text-anchor="middle" fill="#aebfc4">hidden layer</text><text x="340" y="66" text-anchor="middle" fill="#aebfc4">output</text></g>
</svg>
