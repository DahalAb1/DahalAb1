<svg xmlns="http://www.w3.org/2000/svg" width="400" height="156" viewBox="0 0 400 156" role="img" aria-labelledby="title desc">
  <title id="title">Raft leader failover</title><desc id="desc">In this four-server illustration, A goes offline. After an election timeout, B requests votes from C and D. With its own vote and both replies, B becomes leader with a three-of-four majority. A stays offline. Schematic illustration.</desc>
  <style>.packet { opacity:0; }.initial-role{animation:initial-role-intro 4.8s linear 0s 1, initial-role-sequence 16.9s linear 5.8s infinite;}.offline-role{animation:offline-role-intro 4.8s linear 0s 1, offline-role-sequence 16.9s linear 5.8s infinite;}.follower-role{animation:follower-role-intro 4.8s linear 0s 1, follower-role-sequence 16.9s linear 5.8s infinite;}.candidate-role{animation:candidate-role-intro 4.8s linear 0s 1, candidate-role-sequence 16.9s linear 5.8s infinite;}.leader-role{animation:leader-role-intro 4.8s linear 0s 1, leader-role-sequence 16.9s linear 5.8s infinite;}.new-leader{animation:new-leader-intro 4.8s linear 0s 1, new-leader-sequence 16.9s linear 5.8s infinite;}.stage-start{animation:stage-start-intro 4.8s linear 0s 1, stage-start-sequence 16.9s linear 5.8s infinite;}.stage-timeout{animation:stage-timeout-intro 4.8s linear 0s 1, stage-timeout-sequence 16.9s linear 5.8s infinite;}.stage-vote{animation:stage-vote-intro 4.8s linear 0s 1, stage-vote-sequence 16.9s linear 5.8s infinite;}.stage-done{animation:stage-done-intro 4.8s linear 0s 1, stage-done-sequence 16.9s linear 5.8s infinite;}
            .old-server { animation:disconnect-intro 4.8s linear 0s 1, disconnect-sequence 16.9s linear 5.8s infinite; }
            .vote-request { animation:ask-vote-intro 4.8s ease-in-out 0s 1, ask-vote-sequence 16.9s ease-in-out 5.8s infinite; }
            .vote-reply { animation:grant-vote-intro 4.8s ease-in-out 0s 1, grant-vote-sequence 16.9s ease-in-out 5.8s infinite; }
            .vote-reply-late { animation:grant-vote-late-intro 4.8s ease-in-out 0s 1, grant-vote-late-sequence 16.9s ease-in-out 5.8s infinite; }



            @media(prefers-reduced-motion:reduce) {
              .old-server,.vote-request,.vote-reply,.vote-reply-late,
              .initial-role,.offline-role,.follower-role,.candidate-role,.leader-role,
              .new-leader,.stage-start,.stage-timeout,.stage-vote,.stage-done { animation:none; }
            }
