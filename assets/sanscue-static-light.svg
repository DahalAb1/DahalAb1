<svg xmlns="http://www.w3.org/2000/svg" width="400" height="112" viewBox="0 0 400 112" role="img" aria-labelledby="title desc">
  <title id="title">SansCue audience feedback loop</title><desc id="desc">Speaker context informs an AI check-in draft. A moderator reviews and publishes it. Audience clarity feedback returns to the speaker. Schematic illustration.</desc>
  <style>.packet { opacity:0; }</style>
  <rect width="400" height="112" rx="8" fill="#f6faf9"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13"><g font-size="10" letter-spacing="1">
          <text x="56" y="18" text-anchor="middle" fill="#526f68">SPEAKER</text><text x="197" y="18" text-anchor="middle" fill="#526f68">MODERATOR</text><text x="332" y="18" text-anchor="middle" fill="#526f68">AUDIENCE</text>
        </g>
        <path d="M96 52 H141 M253 52 H289 M332 76 V91 H56 V75" fill="none" stroke="#cdded7" stroke-width="1.5"/>
        <path d="M134 49 L141 52 L134 55 M282 49 L289 52 L282 55 M53 82 L56 75 L59 82" fill="none" stroke="#167b66" stroke-width="1.5"/>
        <rect x="16" y="31" width="80" height="44" rx="7" fill="#f6faf9" stroke="#cdded7"/>
        <g class="speech-wave" stroke="#167b66" stroke-width="2" stroke-linecap="round">
          <path d="M34 49 V57 M43 42 V64 M52 47 V59 M61 39 V67 M70 46 V60 M79 50 V56"/>
        </g>
        <rect x="141" y="31" width="112" height="44" rx="7" fill="#f6faf9" stroke="#cdded7"/>
        <text x="197" y="47" text-anchor="middle" fill="#526f68" font-size="12">AI check-in draft</text>
        <rect class="review-gate" x="145" y="53" width="104" height="18" rx="4" fill="#167b66" opacity=".12"/>
        <text x="197" y="66" text-anchor="middle" fill="#167b66" font-size="10">review &amp; publish</text>
        <rect x="289" y="31" width="87" height="45" rx="7" fill="#f6faf9" stroke="#cdded7"/>
        <g class="audience-reply" fill="#deeee7" stroke="#167b66" stroke-width="1.5" style="--soft:#deeee7;--accent:#167b66">
          <circle cx="309" cy="44" r="4"/><circle cx="332" cy="44" r="4"/><circle cx="355" cy="44" r="4"/>
          <path d="M302 65 V59 A7 7 0 0 1 316 59 V65 M325 65 V59 A7 7 0 0 1 339 59 V65 M348 65 V59 A7 7 0 0 1 362 59 V65"/>
        </g>
        <text x="197" y="106" text-anchor="middle" fill="#167b66" font-size="12">clarity feedback</text>
        <circle class="packet context" cx="96" cy="52" r="3" fill="#167b66"/>
        <circle class="packet check-in" cx="253" cy="52" r="3" fill="#167b66"/>
        <circle class="packet feedback" cx="332" cy="91" r="3" fill="#167b66"/>
        </g>
</svg>
