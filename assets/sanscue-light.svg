<svg xmlns="http://www.w3.org/2000/svg" width="400" height="112" viewBox="0 0 400 112" role="img" aria-labelledby="title desc">
  <title id="title">SansCue audience feedback loop</title><desc id="desc">Speaker context informs an AI check-in draft. A moderator reviews and publishes it. Audience clarity feedback returns to the speaker. Schematic illustration.</desc>
  <style>.packet { opacity:0; }
        .context { animation:context-intro 4.8s ease-in-out 0s 1, context-sequence 16.9s ease-in-out 5.8s infinite; }
        .check-in { animation:publish-intro 4.8s ease-in-out 0s 1, publish-sequence 16.9s ease-in-out 5.8s infinite; }
        .feedback { animation:feedback-intro 4.8s ease-in-out 0s 1, feedback-sequence 16.9s ease-in-out 5.8s infinite; }
        .review-gate { animation:review-intro 4.8s ease-in-out 0s 1, review-sequence 16.9s ease-in-out 5.8s infinite; }
        .speech-wave { animation:speech-intro 4.8s ease-in-out 0s 1, speech-sequence 16.9s ease-in-out 5.8s infinite; }
        .audience-reply { animation:reply-intro 4.8s ease-in-out 0s 1, reply-sequence 16.9s ease-in-out 5.8s infinite; }






        @media(prefers-reduced-motion:reduce) {
          .context,.check-in,.feedback,.review-gate,.speech-wave,.audience-reply { animation:none; }
        }
        @keyframes context-intro{0.00000000%{opacity:0; transform:translateX(0);}5.00000000%{opacity:0; transform:translateX(0);}8.00000000%{opacity:1; transform:translateX(0);}22.00000000%{opacity:1; transform:translateX(45px);}25.00000000%{opacity:0; transform:translateX(45px);}100.00000000%{opacity:0; transform:translateX(45px);}}@keyframes context-sequence{0.00000000%{opacity:0; transform:translateX(45px);}55.62124260%{opacity:0; transform:translateX(45px);}55.62130178%{opacity:0; transform:translateX(0);}57.04142012%{opacity:0; transform:translateX(0);}57.89349112%{opacity:1; transform:translateX(0);}61.86982249%{opacity:1; transform:translateX(45px);}62.72189349%{opacity:0; transform:translateX(45px);}84.02366864%{opacity:0; transform:translateX(45px);}100.00000000%{opacity:0; transform:translateX(45px);}}@keyframes publish-intro{0.00000000%{opacity:0; transform:translateX(0);}43.00000000%{opacity:0; transform:translateX(0);}46.00000000%{opacity:1; transform:translateX(0);}60.00000000%{opacity:1; transform:translateX(36px);}63.00000000%{opacity:0; transform:translateX(36px);}100.00000000%{opacity:0; transform:translateX(36px);}}@keyframes publish-sequence{0.00000000%{opacity:0; transform:translateX(36px);}55.62124260%{opacity:0; transform:translateX(36px);}55.62130178%{opacity:0; transform:translateX(0);}67.83431953%{opacity:0; transform:translateX(0);}68.68639053%{opacity:1; transform:translateX(0);}72.66272189%{opacity:1; transform:translateX(36px);}73.51479290%{opacity:0; transform:translateX(36px);}84.02366864%{opacity:0; transform:translateX(36px);}100.00000000%{opacity:0; transform:translateX(36px);}}@keyframes feedback-intro{0.00000000%{opacity:0; transform:translate(0,0);}69.00000000%{opacity:0; transform:translate(0,0);}72.00000000%{opacity:1; transform:translate(0,0);}92.00000000%{opacity:1; transform:translate(-276px,0);}96.00000000%{opacity:1; transform:translate(-276px,-16px);}99.00000000%{opacity:0; transform:translate(-276px,-16px);}100.00000000%{opacity:0; transform:translate(-276px,-16px);}}@keyframes feedback-sequence{0.00000000%{opacity:0; transform:translate(-276px,-16px);}55.62124260%{opacity:0; transform:translate(-276px,-16px);}55.62130178%{opacity:0; transform:translate(0,0);}75.21893491%{opacity:0; transform:translate(0,0);}76.07100592%{opacity:1; transform:translate(0,0);}81.75147929%{opacity:1; transform:translate(-276px,0);}82.88757396%{opacity:1; transform:translate(-276px,-16px);}83.73964497%{opacity:0; transform:translate(-276px,-16px);}84.02366864%{opacity:0; transform:translate(-276px,-16px);}100.00000000%{opacity:0; transform:translate(-276px,-16px);}}@keyframes review-intro{0.00000000%{opacity:.12;}22.00000000%{opacity:.12;}29.00000000%{opacity:.4;}39.00000000%{opacity:.4;}46.00000000%{opacity:.12;}100.00000000%{opacity:.12;}}@keyframes review-sequence{0.00000000%{opacity:.12;}55.62124260%{opacity:.12;}55.62130178%{opacity:.12;}61.86982249%{opacity:.12;}63.85798817%{opacity:.4;}66.69822485%{opacity:.4;}68.68639053%{opacity:.12;}84.02366864%{opacity:.12;}100.00000000%{opacity:.12;}}@keyframes speech-intro{0.00000000%{opacity:1;}6.00000000%{opacity:.35;}12.00000000%{opacity:1;}100.00000000%{opacity:1;}}@keyframes speech-sequence{0.00000000%{opacity:1;}55.62124260%{opacity:1;}55.62130178%{opacity:1;}57.32544379%{opacity:.35;}59.02958580%{opacity:1;}84.02366864%{opacity:1;}100.00000000%{opacity:1;}}@keyframes reply-intro{0.00000000%{fill:var(--soft);}60.00000000%{fill:var(--soft);}66.00000000%{fill:var(--accent);}75.00000000%{fill:var(--soft);}100.00000000%{fill:var(--soft);}}@keyframes reply-sequence{0.00000000%{fill:var(--soft);}55.62124260%{fill:var(--soft);}55.62130178%{fill:var(--soft);}72.66272189%{fill:var(--soft);}74.36686391%{fill:var(--accent);}76.92307692%{fill:var(--soft);}84.02366864%{fill:var(--soft);}100.00000000%{fill:var(--soft);}}</style>
  <rect width="400" height="112" rx="8" fill="#f6faf9"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13"><g font-size="10" letter-spacing="1">
          <text x="56" y="18" text-anchor="middle" fill="#526f68">SPEAKER</text><text x="197" y="18" text-anchor="middle" fill="#526f68">MODERATOR</text><text x="332" y="18" text-anchor="middle" fill="#526f68">AUDIENCE</text>
        </g>
        <path d="M96 52 H141 M253 52 H289 M332 76 V91 H56 V75" fill="none" stroke="#cdded7" stroke-width="1.5"/>
        <path d="M134 49 L141 52 L134 55 M282 49 L289 52 L282 55 M53 82 L56 75 L59 82" fill="none" stroke="#167b66" stroke-width="1.5"/>
        <rect x="16" y="31" width="80" height="44" rx="7" fill="#f6faf9" stroke="#cdded7"/>
        <g class="speech-wave" stroke="#167b66" stroke-width="2" stroke-linecap="round">
          <path d="M34 49 V57 M43 42 V64 M52 47 V59 M61 39 V67 M70 46 V60 M79 50 V56"/>
        </g>
        <rect x="141" y="31" width="112" height="44" rx="7" fill="#f6faf9" stroke="#cdded7"/>
        <text x="197" y="47" text-anchor="middle" fill="#526f68" font-size="12">AI check-in draft</text>
        <rect class="review-gate" x="145" y="53" width="104" height="18" rx="4" fill="#167b66" opacity=".12"/>
        <text x="197" y="66" text-anchor="middle" fill="#167b66" font-size="10">review &amp; publish</text>
        <rect x="289" y="31" width="87" height="45" rx="7" fill="#f6faf9" stroke="#cdded7"/>
        <g class="audience-reply" fill="#deeee7" stroke="#167b66" stroke-width="1.5" style="--soft:#deeee7;--accent:#167b66">
          <circle cx="309" cy="44" r="4"/><circle cx="332" cy="44" r="4"/><circle cx="355" cy="44" r="4"/>
          <path d="M302 65 V59 A7 7 0 0 1 316 59 V65 M325 65 V59 A7 7 0 0 1 339 59 V65 M348 65 V59 A7 7 0 0 1 362 59 V65"/>
        </g>
        <text x="197" y="106" text-anchor="middle" fill="#167b66" font-size="12">clarity feedback</text>
        <circle class="packet context" cx="96" cy="52" r="3" fill="#167b66"/>
        <circle class="packet check-in" cx="253" cy="52" r="3" fill="#167b66"/>
        <circle class="packet feedback" cx="332" cy="91" r="3" fill="#167b66"/>
        </g>
</svg>
