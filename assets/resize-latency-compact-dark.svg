<svg xmlns="http://www.w3.org/2000/svg" width="360" height="212" viewBox="0 0 360 212" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
<title id="title">Worst insert latency at four million keys</title>
<desc id="desc">Incremental HMap: 0.429 milliseconds. std::unordered_map: 241 milliseconds. Apple M2, -O2, in-process microbenchmark. Custom entries and hashes prepared before timing; std::unordered_map not pre-reserved. Source: https://github.com/DahalAb1/Redis/tree/main/bench</desc>
<text x="8" y="20" fill="#a6b0bb" font-size="12" font-weight="600" text-anchor="start">STORAGE / RESIZE BENCHMARK</text>
<text x="8" y="51" fill="#f0f6fc" font-size="22" font-weight="600" text-anchor="start">Worst single insert</text>
<text x="8" y="76" fill="#a6b0bb" font-size="15" font-weight="400" text-anchor="start">4 million keys. Lower is better.</text>
<path d="M180.0 94 V162" stroke="#3d444d"/>
<text x="8" y="126" fill="#7ee2a8" font-size="36" font-weight="600" text-anchor="start">0.429</text>
<text x="112" y="126" fill="#a6b0bb" font-size="17" font-weight="400" text-anchor="start">ms</text>
<text x="188" y="126" fill="#f0f6fc" font-size="36" font-weight="600" text-anchor="start">241</text>
<text x="259" y="126" fill="#a6b0bb" font-size="17" font-weight="400" text-anchor="start">ms</text>
<text x="8" y="155" fill="#f0f6fc" font-size="15" font-weight="400" text-anchor="start">Incremental HMap</text>
<text x="188" y="155" fill="#f0f6fc" font-size="15" font-weight="400" text-anchor="start">std::unordered_map</text>
<text x="8" y="192" fill="#a6b0bb" font-size="14" font-weight="400" text-anchor="start">Apple M2 / -O2 / in-process</text>
</svg>
